services:
  - type: web
    name: hearmeout
    runtime: node
    plan: free
    region: frankfurt
    rootDir: hearmeout
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      # Signs the session cookie (hearmeout/src/lib/identity.ts). 32+ random
      # characters; without it nobody can sign in. Changing it signs everyone out.
      - key: SESSION_SECRET
        sync: false
      # Optional: concerts on the artist page (Ticketmaster Discovery API).
      - key: TICKETMASTER_API_KEY
        sync: false
