name: Keep Render service awake

# Render's free tier spins the service down after 15 minutes with no
# incoming requests, so the first real visitor pays for a ~40s cold start.
# A GitHub Actions cron on a schedule this tight can run a few minutes late
# under load, so 10 minutes gives comfortable margin under that 15-minute
# window rather than cutting it close.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: curl -fsS --max-time 60 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://hearmeoutt.art/
