name: Keep Render service awake

# Render's free tier spins the service down after 15 minutes with no
# incoming requests. GitHub runs scheduled workflows late under load (in
# practice every 20–25 minutes for a */10 schedule), so this asks for every
# 5 minutes and is only a backup — the main pinger is an external service
# (cron-job.org or UptimeRobot) hitting /api/health every 5–10 minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the live site
        # A cold start can take ~60s; retry a couple of times before failing.
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://hearmeoutt.art/api/health
